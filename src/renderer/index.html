<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mip-Paper</title>
    <link rel="stylesheet" href="./styles.css">
    <link rel="stylesheet" href="./panel.css">
    <link rel="stylesheet" href="./context-menu.css">
    <link rel="stylesheet" href="../../node_modules/qweather-icons/font/qweather-icons.css">
  </head>
  <body>
    <canvas id="wallpaper"></canvas>
    <main class="information-panel" id="information-panel" aria-label="桌面信息面板">
      <section class="information-card card-time" data-panel-card="time">
        <div class="information-card-surface">
          <div class="card-kicker">LOCAL TIME</div>
          <time class="card-large" data-field="time">--:--</time>
          <div class="card-sub" data-field="date">LOCAL</div>
        </div>
      </section>
      <section class="information-card card-weather" data-panel-card="weather">
        <div class="information-card-surface">
          <div class="card-kicker">COASTAL WEATHER</div>
          <div class="weather-line"><strong class="card-large" data-field="temperature">--°</strong><i class="weather-icon qi-999" data-field="weather-icon" aria-hidden="true"></i></div>
          <div class="card-sub" data-field="condition">UNAVAILABLE</div>
        </div>
      </section>
      <section class="information-card card-tide" data-panel-card="tide">
        <div class="information-card-surface">
          <div class="card-kicker">TIDAL STATE / P2352</div>
          <strong class="card-large" data-field="tide-state">--</strong>
          <div class="card-sub" data-field="tide-next">UNAVAILABLE</div>
          <div class="card-chips"><span data-field="tide-status">NO DATA</span></div>
        </div>
      </section>
      <section class="information-card card-calendar" data-panel-card="calendar">
        <div class="information-card-surface">
          <div class="card-kicker" data-field="month">CALENDAR</div>
          <div class="calendar-weekdays" data-field="calendar-weekdays"></div>
          <div class="calendar-days" data-field="calendar-days"></div>
        </div>
      </section>
      <section class="audio-ribbon" data-audio-ribbon aria-hidden="true">
        <svg viewBox="0 0 1000 140" preserveAspectRatio="none">
          <defs>
            <linearGradient id="audio-ribbon-edge-fade">
              <stop offset="0%" stop-color="black"></stop>
              <stop offset="14%" stop-color="white"></stop>
              <stop offset="86%" stop-color="white"></stop>
              <stop offset="100%" stop-color="black"></stop>
            </linearGradient>
            <mask id="audio-ribbon-edge-mask">
              <rect width="1000" height="140" fill="url(#audio-ribbon-edge-fade)"></rect>
            </mask>
          </defs>
          <g mask="url(#audio-ribbon-edge-mask)">
            <path class="audio-path audio-path-energy" data-audio-path="energy"></path>
            <path class="audio-path audio-path-left" data-audio-path="left"></path>
            <path class="audio-path audio-path-right" data-audio-path="right"></path>
          </g>
        </svg>
      </section>
    </main>
    <div id="context-menu" role="menu" hidden></div>
    <output id="error" hidden></output>
    <script type="module" src="./renderer.mjs"></script>
  </body>
</html>
